services:
  backend:
    build:
      context: ./backend
      dockerfile: dockerfile
    ports:
      - "8000:8000"
    env_file:              # FIXED: Use env_file to load a .env file
      - .env
    develop:
      watch:
        - action: sync
          path: ./backend
          target: /app
          ignore:
            - .venv/
        - action: rebuild
          path: ./backend/pyproject.toml

  frontend:
    build:
      context: ./frontend
      dockerfile: dockerfile
      args:                # NEW: Pass variables to the Dockerfile build stage
        VITE_API_BASE: ${VITE_API_BASE}
        VITE_GOOGLE_OAUTH_URL: ${VITE_GOOGLE_OAUTH_URL}
    ports:
      - "80:80"
    depends_on:
      - backend
