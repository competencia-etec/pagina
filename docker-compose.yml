services:
  backend:
    build:
      context: ./backend
      dockerfile: dockerfile
    expose:
      - "8000"
    develop:
      watch:
        - action: sync
          path: ./backend
          target: /app
          ignore:
            - .venv/
        - action: rebuild
          path: ./backend/pyproject.toml

  frontend:
    build:
      context: ./frontend
      dockerfile: dockerfile

    environment:
      - ARG VITE_GOOGLE_OAUTH_URL= ${VITE_GOOGLE_OAUTH_URL:?API_URL must be set}
    ports:
      - "80:80"
    depends_on:
      - backend
