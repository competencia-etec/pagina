services:
  backend:
    build:
      context: ./backend
      dockerfile: dockerfile
    expose:
      - "80"
    develop:
      watch:
        - action: sync
          path: ./backend
          target: /app
          ignore:
            - .venv/
        - action: rebuild
          path: ./backend/pyproject.toml

  frontend:
    build:
      context: ./frontend
      dockerfile: dockerfile
    ports:
      - "8000:80"
    depends_on:
      - backend
